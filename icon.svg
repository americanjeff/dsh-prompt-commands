<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" color="#836042">
  <title>dsh-prompt-commands — slash opens the command menu</title>
  <!-- a solid / on the left; to its right the command list it opens:
       the selected entry as a solid bar, the rest as quiet text lines. -->
  <path d="M25 9 H33 L12 55 H4 Z" fill="currentColor"/>
  <g fill="currentColor">
    <rect x="36" y="12" width="20" height="6.5" rx="3.25"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
    <path d="M38 31 H54"/>
    <path d="M38 45.5 H48"/>
  </g>
</svg>